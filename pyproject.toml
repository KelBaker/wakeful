[project]
name = "wakeful"
version = "0.1.0"
description = "Agendador de tarefas para Windows feito para rodar scripts Python, incluindo automações de interface que exigem a sessão desbloqueada."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kelvin Henrique" }]
dependencies = [
    "APScheduler>=3.10,<4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wakeful = "wakeful.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wakeful*"]
