<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>wakeful</title>
  <style>
    @font-face {
      font-family: "Archivo Black";
      src: url("fonts/ArchivoBlack-Regular.ttf") format("truetype");
      font-weight: 400;
      font-display: swap;
    }
    :root {
      --black: #0b0c08;
      --row: #131409;
      --row-hover: #191a10;
      --hairline: #262712;
      --amber: #ffb400;
      --amber-dim: #7a5a12;
      --warm-white: #f4ead1;
      --muted: #8c866c;
      --ok: #4ade80;
      --fail: #ef5350;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--black);
      color: var(--warm-white);
      font-family: "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--hairline); }

    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 24px 60px; }

    /* ---- header: barra de status tipo painel de aeroporto ---- */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 2px solid var(--amber);
      padding-bottom: 14px;
      margin-bottom: 4px;
    }
    /* ---- wordmark: letreiro de LED âmbar, letras espaçadas com leve brilho ---- */
    .wordmark {
      font-family: "Archivo Black", "Cascadia Code", sans-serif;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: -.01em;
      line-height: 1;
      /* preenchimento com gradiente + textura de linhas por dentro da letra,
         em vez de sombra atras -- a profundidade fica no miolo do tipo */
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 1px, transparent 1px, transparent 3px),
        radial-gradient(130% 200% at 25% 15%, #fff3c4 0%, #ffb400 38%, #a85f00 72%, #3d2400 100%);
      background-blend-mode: multiply;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header .clock {
      font-size: 15px;
      color: var(--amber-dim);
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      justify-content: flex-end;
      padding: 14px 0 18px;
    }
    .btn-add {
      background: none;
      border: 1px solid var(--amber-dim);
      color: var(--amber);
      font-family: inherit;
      font-size: 13px;
      padding: 7px 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .btn-add:hover { border-color: var(--amber); background: rgba(255,180,0,.06); }

    /* ---- board: lista de tarefas ---- */
    .board { border-top: 1px solid var(--hairline); }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 4px;
      border-bottom: 1px solid var(--hairline);
      transition: background .1s;
    }
    .row:hover { background: var(--row-hover); }

    .row-main { min-width: 0; flex: 1; overflow: hidden; }
    .row-line1 { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
    }
    .dot.sucesso { background: var(--ok); box-shadow: 0 0 6px rgba(74,222,128,.6); }
    .dot.falha { background: var(--fail); box-shadow: 0 0 6px rgba(239,83,80,.6); }
    .dot.rodando { background: var(--amber); box-shadow: 0 0 6px rgba(255,180,0,.7); }
    .dot.nunca-rodou { background: var(--muted); }

    .row-name {
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .row-status-text { font-size: 11.5px; color: var(--muted); white-space: nowrap; flex-shrink: 0; }

    .row-command {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-when {
      text-align: right;
      flex-shrink: 0;
      width: 150px;
      font-size: 12.5px;
      color: var(--amber-dim);
      line-height: 1.5;
      white-space: nowrap;
    }
    .row-when .cron { color: var(--amber); font-weight: 700; }

    .row-actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      width: 28px; height: 28px;
      cursor: pointer;
      transition: color .15s;
    }
    .icon-btn:hover { color: var(--amber); }
    .icon-btn.danger:hover { color: var(--fail); }

    .empty {
      color: var(--muted);
      font-size: 13.5px;
      text-align: center;
      padding: 50px 0;
      border-bottom: 1px solid var(--hairline);
    }

    /* ---- overlay / modal ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .overlay.hidden { display: none; }

    .ticket {
      background: var(--row);
      border: 1px solid var(--amber-dim);
      padding: 26px;
      width: 100%;
      max-width: 420px;
    }
    .ticket h2 {
      font-size: 15px;
      color: var(--amber);
      letter-spacing: .04em;
      margin: 0 0 20px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--hairline);
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
      letter-spacing: .03em;
    }
    .field input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--hairline);
      color: var(--warm-white);
      font-family: inherit;
      font-size: 13.5px;
      padding: 6px 2px;
    }
    .field input:focus { outline: none; border-bottom-color: var(--amber); }
    .field input::placeholder { color: #4a462f; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .ticket-actions { display: flex; justify-content: flex-end; gap: 18px; margin-top: 22px; }
    .link-btn {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 13px;
    }
    .link-btn.cancel { color: var(--muted); }
    .link-btn.cancel:hover { color: var(--warm-white); }
    .link-btn.save { color: var(--black); background: var(--amber); padding: 7px 16px; font-weight: 700; }
    .link-btn.save:hover { background: #ffc633; }

    .log-ticket { max-width: 640px; max-height: 78vh; display: flex; flex-direction: column; }
    .log-ticket .head { display: flex; justify-content: space-between; align-items: baseline; }
    .log-body {
      background: #000;
      border: 1px solid var(--hairline);
      padding: 12px;
      font-size: 12px;
      overflow: auto;
      white-space: pre-wrap;
      color: #a8a290;
      flex: 1;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="wordmark">Wakeful</span>
      <span class="clock" id="clock">--:--:--</span>
    </header>

    <div class="toolbar">
      <button id="btn-new" class="btn-add">+ nova tarefa</button>
    </div>

    <div class="board" id="board">
      <div id="tasks"></div>
      <p id="empty" class="empty" style="display:none">nenhuma tarefa cadastrada — clique em "+ nova tarefa"</p>
    </div>
  </div>

  <!-- modal criar/editar -->
  <div id="modal" class="overlay hidden">
    <div class="ticket">
      <h2 id="modal-title">nova tarefa</h2>
      <form id="form">
        <div class="field">
          <label>nome</label>
          <input name="name" required />
        </div>
        <div class="field">
          <label>comando (separado por espaço)</label>
          <input name="command" required placeholder="python tasks/example_backup.py" />
        </div>
        <div class="field">
          <label>cron (min hora dia mês dia-semana)</label>
          <input name="cron" required placeholder="0 3 * * *" />
        </div>
        <div class="field-row">
          <div class="field">
            <label>timeout (s)</label>
            <input name="timeout_seconds" type="number" value="600" />
          </div>
          <div class="field">
            <label>retries</label>
            <input name="retries" type="number" value="0" />
          </div>
        </div>
        <div class="field">
          <label>working dir</label>
          <input name="working_dir" value="." />
        </div>
        <div class="ticket-actions">
          <button type="button" id="btn-cancel" class="link-btn cancel">cancelar</button>
          <button type="submit" class="link-btn save">salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- modal log -->
  <div id="log-modal" class="overlay hidden">
    <div class="ticket log-ticket">
      <div class="head">
        <h2 id="log-title" style="border:none; margin:0; padding:0">log</h2>
        <button id="btn-close-log" class="icon-btn">✕</button>
      </div>
      <pre id="log-content" class="log-body"></pre>
    </div>
  </div>

  <script>
    const statusLabel = {
      sucesso: "sucesso",
      falha: "falha",
      rodando: "rodando",
      "nunca-rodou": "nunca rodou",
    };

    let editingName = null;

    function tickClock() {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("pt-BR", { hour12: false });
    }
    tickClock();
    setInterval(tickClock, 1000);

    async function loadTasks() {
      const res = await fetch("/api/tasks");
      const tasks = await res.json();
      const container = document.getElementById("tasks");
      const empty = document.getElementById("empty");
      container.innerHTML = "";
      empty.style.display = tasks.length > 0 ? "none" : "block";

      for (const t of tasks) {
        const el = document.createElement("div");
        el.className = "row";
        const nextRun = t.next_run
          ? new Date(t.next_run).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
          : "—";
        el.innerHTML = `
          <div class="row-main">
            <div class="row-line1">
              <span class="dot ${t.status}"></span>
              <span class="row-name">${t.name}</span>
              <span class="row-status-text">${statusLabel[t.status]}</span>
            </div>
            <div class="row-command">${t.command.join(" ")}</div>
          </div>
          <div class="row-when">
            <div class="cron">${t.cron}</div>
            <div>próxima ${nextRun}</div>
          </div>
          <div class="row-actions">
            <button data-action="run" class="icon-btn" title="Rodar agora">▶</button>
            <button data-action="log" class="icon-btn" title="Ver log">▤</button>
            <button data-action="edit" class="icon-btn" title="Editar">✎</button>
            <button data-action="delete" class="icon-btn danger" title="Apagar">✕</button>
          </div>
        `;
        el.querySelector('[data-action="run"]').onclick = () => runTask(t.name);
        el.querySelector('[data-action="log"]').onclick = () => showLog(t.name);
        el.querySelector('[data-action="edit"]').onclick = () => openModal(t);
        el.querySelector('[data-action="delete"]').onclick = () => deleteTask(t.name);
        container.appendChild(el);
      }
    }

    async function runTask(name) {
      await fetch(`/api/tasks/${encodeURIComponent(name)}/run`, { method: "POST" });
      setTimeout(loadTasks, 500);
    }

    async function deleteTask(name) {
      if (!confirm(`Apagar a tarefa "${name}"?`)) return;
      await fetch(`/api/tasks/${encodeURIComponent(name)}`, { method: "DELETE" });
      loadTasks();
    }

    async function showLog(name) {
      const res = await fetch(`/api/tasks/${encodeURIComponent(name)}/log`);
      const data = await res.json();
      document.getElementById("log-title").textContent = `log — ${name}`;
      document.getElementById("log-content").textContent = data.lines.join("\n") || "(sem execuções hoje)";
      document.getElementById("log-modal").classList.remove("hidden");
    }

    function openModal(task) {
      editingName = task ? task.name : null;
      document.getElementById("modal-title").textContent = task ? "editar tarefa" : "nova tarefa";
      const form = document.getElementById("form");
      form.reset();
      if (task) {
        form.name.value = task.name;
        form.name.disabled = true;
        form.command.value = task.command.join(" ");
        form.cron.value = task.cron;
        form.timeout_seconds.value = task.timeout_seconds;
        form.retries.value = task.retries;
        form.working_dir.value = task.working_dir;
      } else {
        form.name.disabled = false;
      }
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }

    document.getElementById("btn-new").onclick = () => openModal(null);
    document.getElementById("btn-cancel").onclick = closeModal;
    document.getElementById("btn-close-log").onclick = () => document.getElementById("log-modal").classList.add("hidden");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        command: form.command.value.trim().split(/\s+/),
        cron: form.cron.value.trim(),
        timeout_seconds: Number(form.timeout_seconds.value),
        retries: Number(form.retries.value),
        working_dir: form.working_dir.value.trim() || ".",
      };
      const url = editingName ? `/api/tasks/${encodeURIComponent(editingName)}` : "/api/tasks";
      const method = editingName ? "PUT" : "POST";
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || "Erro ao salvar tarefa");
        return;
      }
      closeModal();
      loadTasks();
    };

    loadTasks();
    setInterval(loadTasks, 5000);
  </script>
</body>
</html>
