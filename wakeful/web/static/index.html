<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>wakeful</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <div class="max-w-5xl mx-auto p-6">
    <header class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⏰</span>
        <h1 class="text-xl font-semibold">wakeful</h1>
      </div>
      <button id="btn-new" class="bg-indigo-600 hover:bg-indigo-500 transition rounded-lg px-4 py-2 text-sm font-medium">
        + Nova tarefa
      </button>
    </header>

    <div id="tasks" class="grid gap-3"></div>
    <p id="empty" class="hidden text-zinc-500 text-sm mt-8 text-center">
      Nenhuma tarefa cadastrada ainda. Clique em "Nova tarefa" pra começar.
    </p>
  </div>

  <!-- modal criar/editar -->
  <div id="modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-full max-w-md">
      <h2 id="modal-title" class="text-lg font-semibold mb-4">Nova tarefa</h2>
      <form id="form" class="space-y-3">
        <div>
          <label class="text-xs text-zinc-400">Nome</label>
          <input name="name" required class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs text-zinc-400">Comando (separado por espaço)</label>
          <input name="command" required placeholder="python tasks/example_backup.py"
                 class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="text-xs text-zinc-400">Cron (min hora dia mês dia-semana)</label>
          <input name="cron" required placeholder="0 3 * * *"
                 class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-zinc-400">Timeout (s)</label>
            <input name="timeout_seconds" type="number" value="600"
                   class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-xs text-zinc-400">Retries</label>
            <input name="retries" type="number" value="0"
                   class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
          </div>
        </div>
        <div>
          <label class="text-xs text-zinc-400">Working dir</label>
          <input name="working_dir" value="."
                 class="w-full mt-1 bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="btn-cancel" class="px-4 py-2 text-sm text-zinc-400 hover:text-zinc-200">Cancelar</button>
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 transition rounded-lg px-4 py-2 text-sm font-medium">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- modal log -->
  <div id="log-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-6 w-full max-w-2xl max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between mb-3">
        <h2 id="log-title" class="text-lg font-semibold">Log</h2>
        <button id="btn-close-log" class="text-zinc-400 hover:text-zinc-200">✕</button>
      </div>
      <pre id="log-content" class="bg-black rounded-lg p-3 text-xs overflow-auto flex-1 whitespace-pre-wrap"></pre>
    </div>
  </div>

  <script>
    const statusColors = {
      "sucesso": "bg-emerald-500/15 text-emerald-400",
      "falha": "bg-red-500/15 text-red-400",
      "rodando": "bg-amber-500/15 text-amber-400",
      "nunca-rodou": "bg-zinc-500/15 text-zinc-400",
    };

    let editingName = null;

    async function loadTasks() {
      const res = await fetch("/api/tasks");
      const tasks = await res.json();
      const container = document.getElementById("tasks");
      const empty = document.getElementById("empty");
      container.innerHTML = "";
      empty.classList.toggle("hidden", tasks.length > 0);

      for (const t of tasks) {
        const el = document.createElement("div");
        el.className = "bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex items-center justify-between gap-4";
        el.innerHTML = `
          <div class="min-w-0">
            <div class="flex items-center gap-2">
              <span class="font-medium truncate">${t.name}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${statusColors[t.status]}">${t.status}</span>
            </div>
            <div class="text-xs text-zinc-500 mt-1 truncate">${t.command.join(" ")}</div>
            <div class="text-xs text-zinc-600 mt-1">
              cron: <code>${t.cron}</code>
              ${t.next_run ? ` · próxima: ${new Date(t.next_run).toLocaleString()}` : ""}
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button data-action="run" class="text-xs px-2 py-1.5 rounded-lg hover:bg-zinc-800" title="Rodar agora">▶</button>
            <button data-action="log" class="text-xs px-2 py-1.5 rounded-lg hover:bg-zinc-800" title="Ver log">📄</button>
            <button data-action="edit" class="text-xs px-2 py-1.5 rounded-lg hover:bg-zinc-800" title="Editar">✎</button>
            <button data-action="delete" class="text-xs px-2 py-1.5 rounded-lg hover:bg-zinc-800 hover:text-red-400" title="Apagar">🗑</button>
          </div>
        `;
        el.querySelector('[data-action="run"]').onclick = () => runTask(t.name);
        el.querySelector('[data-action="log"]').onclick = () => showLog(t.name);
        el.querySelector('[data-action="edit"]').onclick = () => openModal(t);
        el.querySelector('[data-action="delete"]').onclick = () => deleteTask(t.name);
        container.appendChild(el);
      }
    }

    async function runTask(name) {
      await fetch(`/api/tasks/${encodeURIComponent(name)}/run`, { method: "POST" });
      setTimeout(loadTasks, 500);
    }

    async function deleteTask(name) {
      if (!confirm(`Apagar a tarefa "${name}"?`)) return;
      await fetch(`/api/tasks/${encodeURIComponent(name)}`, { method: "DELETE" });
      loadTasks();
    }

    async function showLog(name) {
      const res = await fetch(`/api/tasks/${encodeURIComponent(name)}/log`);
      const data = await res.json();
      document.getElementById("log-title").textContent = `Log — ${name}`;
      document.getElementById("log-content").textContent = data.lines.join("\n") || "(sem execuções hoje)";
      document.getElementById("log-modal").classList.remove("hidden");
    }

    function openModal(task) {
      editingName = task ? task.name : null;
      document.getElementById("modal-title").textContent = task ? "Editar tarefa" : "Nova tarefa";
      const form = document.getElementById("form");
      form.reset();
      if (task) {
        form.name.value = task.name;
        form.name.disabled = true;
        form.command.value = task.command.join(" ");
        form.cron.value = task.cron;
        form.timeout_seconds.value = task.timeout_seconds;
        form.retries.value = task.retries;
        form.working_dir.value = task.working_dir;
      } else {
        form.name.disabled = false;
      }
      document.getElementById("modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
    }

    document.getElementById("btn-new").onclick = () => openModal(null);
    document.getElementById("btn-cancel").onclick = closeModal;
    document.getElementById("btn-close-log").onclick = () => document.getElementById("log-modal").classList.add("hidden");

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const form = e.target;
      const payload = {
        name: form.name.value.trim(),
        command: form.command.value.trim().split(/\s+/),
        cron: form.cron.value.trim(),
        timeout_seconds: Number(form.timeout_seconds.value),
        retries: Number(form.retries.value),
        working_dir: form.working_dir.value.trim() || ".",
      };
      const url = editingName ? `/api/tasks/${encodeURIComponent(editingName)}` : "/api/tasks";
      const method = editingName ? "PUT" : "POST";
      const res = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        alert(err.detail || "Erro ao salvar tarefa");
        return;
      }
      closeModal();
      loadTasks();
    };

    loadTasks();
    setInterval(loadTasks, 5000);
  </script>
</body>
</html>
